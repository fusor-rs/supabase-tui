[package]
name = "supatui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A Supabase console for the terminal, written in HTML with Hypercmd"
readme = "README.md"
repository = "https://github.com/fusor-rs/supabase-tui"
keywords = ["supabase", "postgres", "terminal", "tui"]
categories = ["command-line-utilities", "database"]
include = ["src/**", "ui/**", "assets/**", "build.rs", "install.sh", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md"]

[[bin]]
name = "supatui"
path = "src/main.rs"

[package.metadata.hypercmd]
entry = "ui/app.html"
templates = ["ui"]
styles = ["ui/terminal.css"]

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
fusor-components = { version = "=0.1.5", default-features = false }
humantime = "=2.3.0"
keyring = { version = "=3.6.3", features = [
    "apple-native", "sync-secret-service", "crypto-rust", "vendored",
] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
semver = "=1.0.27"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
signal-hook = "=0.3.18"
thiserror = "=2.0.21"
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "time", "net", "sync", "fs", "io-util"] }

[dependencies.fusor]
package = "fusor-core"
version = "=0.1.5"
default-features = false
features = ["derive"]

[dependencies.hypercmd]
version = "=0.1.2"

[build-dependencies.hypercmd-build]
version = "=0.1.2"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
